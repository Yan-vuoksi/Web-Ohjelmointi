<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauppa - Shopping Cart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            padding: 20px;
        }


        .container {
            max-width: 1000px;
            margin: 0 auto;
        }


        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }


        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }


        .product-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }


        .product-card {
            border: 2px solid #e1e8f0;
            border-radius: 12px;
            padding: 25px;
            background: #f8fafc;
            margin-bottom: 20px;
        }


        .product-name {
            font-size: 1.8em;
            color: #2d3748;
            margin-bottom: 10px;
            font-weight: 600;
        }


        .product-price {
            font-size: 1.5em;
            color: #0984e3;
            margin-bottom: 20px;
            font-weight: bold;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a5568;
            font-size: 1.1em;
        }


        input[type="number"] {
            width: 150px;
            padding: 12px;
            border: 2px solid #e1e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }


        input[type="number"]:focus {
            outline: none;
            border-color: #0984e3;
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.1);
        }


        .add-btn {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 10px;
        }


        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 184, 148, 0.3);
        }


        .cart-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }


        .cart-header {
            font-size: 1.8em;
            color: #2d3748;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #e1e8f0;
            padding-bottom: 15px;
        }


        .cart-items {
            margin-bottom: 20px;
        }


        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #e1e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #f8fafc;
        }


        .item-details {
            flex: 1;
        }


        .item-name {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 5px;
        }


        .item-quantity {
            color: #718096;
            font-size: 0.9em;
        }


        .item-price {
            font-weight: bold;
            color: #0984e3;
            font-size: 1.1em;
        }


        .cart-total {
            border-top: 3px solid #0984e3;
            padding-top: 20px;
            text-align: center;
        }


        .total-amount {
            font-size: 2em;
            font-weight: bold;
            color: #0984e3;
        }


        .empty-cart {
            text-align: center;
            color: #718096;
            font-style: italic;
            padding: 40px;
        }


        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
           
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }
           
            .item-price {
                margin-top: 10px;
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Verkkokauppa</h1>
            <p>Valitse tuote ja lisää ostoskoriin</p>
        </div>


        <div class="product-section">
            <h2>Tuote</h2>
            <div class="product-card">
                <div class="product-name" id="product-name">-</div>
                <div class="product-price" id="product-price">-</div>
               
                <div class="form-group">
                    <label for="quantity">Määrä:</label>
                    <input type="number" id="quantity" min="1" value="1" placeholder="Syötä määrä">
                    <button class="add-btn" onclick="addToCart()"> Lisää ostoskoriin</button>
                </div>
            </div>
        </div>


        <div class="cart-section">
            <h2 class="cart-header">🛍️ Ostoskori</h2>
            <div id="cart-items" class="cart-items">
                <div class="empty-cart">
                    Ostoskori on tyhjä
                </div>
            </div>
            <div class="cart-total">
                <div>Yhteensä: <span class="total-amount" id="total-amount">0.00 €</span></div>
            </div>
        </div>
    </div>


    <script>
        // Product object to display details
        const product = {
            name: "iPhone 15 Pro",
            price: 1299.99
        };


        // Array to store cart items
        const cart = [];


        // Function to display product details
        function displayProduct() {
            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-price').textContent = product.price.toFixed(2) + ' €';
        }


        // Function to add product to cart
        function addToCart() {
            // Read quantity from input
            const quantityInput = document.getElementById('quantity');
            const quantity = parseInt(quantityInput.value);


            // Validate quantity
            if (!quantity || quantity < 1) {
                alert('Syötä kelvollinen määrä!');
                return;
            }


            // Calculate total price for this item
            const totalPrice = quantity * product.price;


            // Create order object
            const order = {
                name: product.name,
                price: product.price,
                quantity: quantity,
                totalPrice: totalPrice
            };


            // Add to cart array
            cart.push(order);


            // Reset quantity input
            quantityInput.value = 1;


            // Update cart display
            updateCartDisplay();


            console.log('Added to cart:', order);
            console.log('Current cart:', cart);
        }


        // Function to update shopping cart display
        function updateCartDisplay() {
            const cartItemsContainer = document.getElementById('cart-items');
            const totalAmountElement = document.getElementById('total-amount');


            // Clear current display
            cartItemsContainer.innerHTML = '';


            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="empty-cart">Ostoskori on tyhjä</div>';
                totalAmountElement.textContent = '0.00 €';
                return;
            }


            // Display each cart item
            cart.forEach((item, index) => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        <div class="item-quantity">Määrä: ${item.quantity} kpl × ${item.price.toFixed(2)} €</div>
                    </div>
                    <div class="item-price">${item.totalPrice.toFixed(2)} €</div>
                `;
                cartItemsContainer.appendChild(cartItem);
            });


            // Calculate and display total amount
            const totalAmount = cart.reduce((sum, item) => sum + item.totalPrice, 0);
            totalAmountElement.textContent = totalAmount.toFixed(2) + ' €';
        }


        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            displayProduct();
            updateCartDisplay();
        });


        // Allow Enter key to add to cart
        document.getElementById('quantity').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addToCart();
            }
        });
    </script>
</body>
</html>
