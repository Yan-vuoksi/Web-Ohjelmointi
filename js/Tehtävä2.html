<!DOCTYPE html>
<html lang="en">
<head>
<title>Conditional statements and loops</title>
</head>
<body>
<h1>Exercise 2</h1>
<h2>Multiplication table:</h2>
<ul id="numerical list"></ul>

<script>
// Enter your code here
let temp = 15;
if(temp < 0){
    console.log("Frost!");
} else if(temp >= 0 && temp <= 20){
    console.log("Suitable outdoor weather!");
} else {
    console.log("HEAT!");
}

for(let i = 1; i <= 10; i++){
    document.getElementById("numerical list").innerHTML += "<li> Number " + i + "</li>";
}
</script>
</body>
</html>
