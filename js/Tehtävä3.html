<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Simple Calculator</title>
<style>
body { font-family: sans-serif; padding: 20px; }
input { padding: 5px; margin: 5px; }

<body>

<h1>Calculator</h1>
<p>Enter two numbers and I will add them together.</p>

<label>Chapter 1:</label>
<input type="number" id="number1" placeholder="Enter Chapter 1"
> <br>

<label>Chapter 2: </label>
<input type="number" id="number2" placeholder="Enter number 2">
<br>

<button onclick="calculateSum()">Calculatesum</button>

<p>Result: <span id="result">-</span></p>

<script>
// ASSIGNMENT: Enter the function calculateSum()
function calculateSum() {
    let num1 = document.getElementById("number1").value;
    let num2 = document.getElementById("number2").value;
    let sum = Number(num1) + Number(num2);
    document.getElementById("result").innerHTML = sum;

}
